name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests parse and every listed plugin exists
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.load(open(".claude-plugin/marketplace.json"))
          for p in m["plugins"]:
              if p.get("strict") is False:
                  # Bundle entry: every listed skill exists, and every plugin skill is listed.
                  listed = {pathlib.Path(s).as_posix() for s in p["skills"]}
                  for s in listed:
                      assert (pathlib.Path(p["source"]) / s / "SKILL.md").is_file(), s
                  have = {f"plugins/{d.name}/skills/{d.name}" for d in pathlib.Path("plugins").iterdir() if d.is_dir()}
                  assert listed == have, sorted(listed ^ have)
                  continue
              d = pathlib.Path(p["source"])
              meta = json.load(open(d / ".claude-plugin/plugin.json"))
              assert meta["name"] == p["name"], (meta["name"], p["name"])
              skill = d / "skills" / p["name"] / "SKILL.md"
              assert skill.read_text().startswith("---\nname: " + p["name"] + "\n"), skill
          print(len(m["plugins"]), "plugins OK")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: docs/ matches the generator output
        run: |
          make site
          git add -N docs
          git diff --exit-code -- docs
